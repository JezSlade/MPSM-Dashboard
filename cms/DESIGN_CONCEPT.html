<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic CMS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <style>
        /* ====================
           🎨 Core Neumorphism & Theme System
           ==================== */
        :root {
            /* Light Theme */
            --bg-light: #e0e5ec;
            --primary-text-light: #5f6c82;
            --secondary-text-light: #a9b7c8;
            --light-shadow: #a3b1c6;
            --dark-shadow: #ffffff;
            --main-bg: var(--bg-light);
            --main-text: var(--primary-text-light);
            --muted-text: var(--secondary-text-light);
            --element-bg: var(--bg-light);
            --element-shadow-out: -3px -3px 7px 0px var(--dark-shadow), 3px 3px 7px 0px var(--light-shadow);
            --element-shadow-in: inset 3px 3px 7px 0px var(--dark-shadow), inset -3px -3px 7px 0px var(--light-shadow);
        }

        /* Dark Theme overrides */
        body.dark-theme {
            --bg-dark: #22252a;
            --primary-text-dark: #b5b5b5;
            --secondary-text-dark: #4d4d4d;
            --light-shadow-dark: #2c2f35;
            --dark-shadow-dark: #1a1c21;
            --main-bg: var(--bg-dark);
            --main-text: var(--primary-text-dark);
            --muted-text: var(--secondary-text-dark);
            --element-bg: var(--bg-dark);
            --element-shadow-out: -3px -3px 7px 0px var(--dark-shadow-dark), 3px 3px 7px 0px var(--light-shadow-dark);
            --element-shadow-in: inset 3px 3px 7px 0px var(--dark-shadow-dark), inset -3px -3px 7px 0px var(--light-shadow-dark);
        }

        /* Global body and font styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--main-bg);
            color: var(--main-text);
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Define text-xxs custom class for tiny text */
        .text-xxs {
            font-size: 0.6rem;
            line-height: 1;
        }

        /* ====================
           🧱 Layout System
           ==================== */
        .main-container {
            display: grid;
            grid-template-areas:
                "header-hero"
                "main"
                "footer-hero";
            grid-template-columns: 1fr;
            grid-template-rows: auto 1fr auto;
            height: 100vh;
            overflow: hidden;
        }
        
        .hero-section {
            box-shadow: var(--element-shadow-out);
            z-index: 10;
        }

        .header-hero {
            grid-area: header-hero;
        }

        .footer-hero {
            grid-area: footer-hero;
        }
        
        .content-area {
            grid-area: main;
            overflow-y: auto;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 12px;
            grid-auto-rows: minmax(min-content, max-content);
        }
        
        /* Smaller controls for widgets */
        .widget-controls .neumorphic-button {
            width: 1rem;
            height: 1rem;
            font-size: 0.6rem;
        }

        /* ====================
           🎨 Neumorphic Elements
           ==================== */
        .neumorphic-out {
            background-color: var(--element-bg);
            box-shadow: var(--element-shadow-out);
            border-radius: 10px;
        }

        .neumorphic-in {
            background-color: var(--element-bg);
            box-shadow: var(--element-shadow-in);
            border-radius: 10px;
        }

        .neumorphic-button {
            transition: all 0.3s ease;
            cursor: pointer;
            user-select: none;
            text-align: center;
        }
        
        .neumorphic-button:hover {
            box-shadow: 3px 3px 7px 0px var(--dark-shadow), -3px -3px 7px 0px var(--light-shadow);
        }
        
        .neumorphic-button:active {
            box-shadow: var(--element-shadow-in);
            color: var(--muted-text);
        }
        
        .dark-theme .neumorphic-button:hover {
             box-shadow: 3px 3px 7px 0px var(--dark-shadow-dark), -3px -3px 7px 0px var(--light-shadow-dark);
        }

        .dark-theme .neumorphic-button:active {
            box-shadow: var(--element-shadow-in);
        }

        .neumorphic-input {
            background-color: var(--element-bg);
            box-shadow: var(--element-shadow-in);
            color: var(--main-text);
            border: none;
            outline: none;
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 10px;
            transition: all 0.3s ease;
        }
        
        .widget-card {
            box-shadow: var(--element-shadow-out);
            transition: box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: move;
        }

        .hero-widget {
            box-shadow: var(--element-shadow-out);
            transition: box-shadow 0.3s ease;
            overflow: hidden;
            display: flex;
            align-items: center;
        }
        
        .widget-card__header {
            border-bottom: 1px solid rgba(0,0,0,0.1);
            user-select: none;
        }
        
        .widget-card__body {
            flex-grow: 1;
        }
        
        .modal-content {
            box-shadow: var(--element-shadow-out);
            background-color: var(--element-bg);
        }
        
        .toggle-switch {
            width: 30px;
            height: 15px;
            border-radius: 7.5px;
            position: relative;
            cursor: pointer;
            box-shadow: var(--element-shadow-in);
        }
        
        .toggle-switch:hover {
             box-shadow: 3px 3px 7px 0px var(--dark-shadow), -3px -3px 7px 0px var(--light-shadow);
        }
        
        .dark-theme .toggle-switch:hover {
            box-shadow: 3px 3px 7px 0px var(--dark-shadow-dark), -3px -3px 7px 0px var(--light-shadow-dark);
        }

        .toggle-switch .dot {
            position: absolute;
            top: 50%;
            left: 2px;
            transform: translateY(-50%);
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background-color: var(--main-text);
            transition: all 0.3s ease;
        }
        
        .toggle-switch.toggled .dot {
            transform: translateY(-50%) translateX(15px);
        }
        
        /* Error Monitor Widget specific styles */
        .error-monitor {
            height: 100%;
            overflow-y: auto;
            color: var(--main-text);
            font-family: monospace;
            font-size: 0.7em;
            padding: 5px;
        }
        .error-monitor ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .error-monitor li {
            background-color: rgba(255, 0, 0, 0.1);
            border-left: 3px solid #dc3545;
            padding: 5px;
            margin-bottom: 5px;
            border-radius: 3px;
        }
        .error-monitor .error-type {
            font-weight: bold;
            color: #e74c3c;
        }
        .error-monitor .error-details {
            opacity: 0.8;
            word-wrap: break-word;
        }
        
        /* Tabbed modal styling */
        .tabs-container {
            display: flex;
            border-bottom: 1px solid var(--muted-text);
            margin-bottom: 1rem;
        }
        .tab-button {
            padding: 0.5rem 1rem;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s ease;
        }
        .tab-button.active {
            border-color: var(--main-text);
            color: var(--main-text);
        }
        .tab-button:hover {
            color: var(--main-text);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--main-text);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="light-theme">

         🖼️ Modal & UI Components
         ==================== -->

            </div>

                <div>

                    <input type="text" id="widget-area-id" name="areaId" class="neumorphic-input w-full" required>
                </div>
                <div>

                    <select id="widget-content-type" name="contentType" class="neumorphic-input w-full">
                        <option value="html">Inline HTML</option>

                </div>

                    <textarea id="gemini-prompt" name="geminiPrompt" class="neumorphic-input w-full h-20 resize-none" placeholder="e.g., 'Write a short inspirational quote about persistence.'"></textarea>

    <!-- ====================
         🖥️ Application Logic
         ==================== -->
    <script>
        // All JavaScript is contained within this single script tag for simplicity.

        /**
         * 🛠️ Data Repositories & Services (Single Responsibility Principle)
         * These classes are the backbone of the application's data management.
         * They now handle all I/O via localStorage and business logic, completely separate from the UI.
         */
        class LocalStorageService {
            constructor() {
                this.storageKey = 'neumorphic_cms_widgets';
                this.settingsKey = 'neumorphic_cms_settings';
            }

            loadWidgets() {
                try {
                    const data = localStorage.getItem(this.storageKey);
                    return data ? JSON.parse(data) : [];
                } catch (e) {
                    console.error("Failed to load widgets from localStorage:", e);
                    return [];
                }
            }
            
            saveWidgets(widgets) {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(widgets));
                } catch (e) {
                    console.error("Failed to save widgets to localStorage:", e);
                }
            }
            
            loadSettings() {
                try {
                    const data = localStorage.getItem(this.settingsKey);
                    return data ? JSON.parse(data) : {};
                } catch (e) {
                    console.error("Failed to load settings from localStorage:", e);
                    return {};
                }
            }
            
            saveSettings(settings) {
                try {
                    localStorage.setItem(this.settingsKey, JSON.stringify(settings));
                } catch (e) {
                    console.error("Failed to save settings to localStorage:", e);
                }
            }
        }
        
        class GeminiService {
            static async generateText(prompt) {
                const chatHistory = [{ role: "user", parts: [{ text: prompt }] }];
                const payload = { contents: chatHistory };
                const apiKey = "";
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${apiKey}`;
                
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.error.message || `API error: ${response.status}`);
                    }
                    
                    const result = await response.json();
                    if (result.candidates && result.candidates.length > 0 && result.candidates[0].content && result.candidates[0].content.parts && result.candidates[0].content.parts.length > 0) {
                        return result.candidates[0].content.parts[0].text;
                    }
                    throw new Error("No candidates returned from API.");
                } catch (e) {
                    console.error("Gemini API call failed:", e);
                    DashboardController.errorMonitorService.addError({ type: "Gemini API Error", message: `Failed to generate content: ${e.message}`, timestamp: new Date().toISOString() });
                    return `Error: ${e.message}`;
                }
            }
        }

        /**
         * ErrorMonitorService captures and stores runtime errors.
         */
        class ErrorMonitorService {
            constructor() {
                this.errors = [];
                this.subscribers = new Set();
                this.setupListeners();
            }

            setupListeners() {
                window.onerror = (message, source, lineno, colno, error) => {
                    this.addError({
                        type: 'JavaScript Error',
                        message,
                        source: `${source}:${lineno}:${colno}`,
                        timestamp: new Date().toISOString()
                    });
                    return false;
                };

                window.addEventListener('unhandledrejection', (event) => {
                    this.addError({
                        type: 'Promise Rejection',
                        message: event.reason ? event.reason.message || event.reason : 'Unknown rejection',
                        timestamp: new Date().toISOString()
                    });
                });
            }

            addError(error) {
                this.errors.unshift(error);
                if (this.errors.length > 50) {
                    this.errors.pop();
                }
                this.notifySubscribers();
            }

            /** @param {Function} callback */
            subscribe(callback) {
                this.subscribers.add(callback);
                callback(this.errors); // Immediately notify with current errors
            }

            /** @param {Function} callback */
            unsubscribe(callback) {
                this.subscribers.delete(callback);
            }

            notifySubscribers() {
                this.subscribers.forEach(callback => callback(this.errors));
            }
        }

        /**
         * 🖼️ DashboardUI (Handles all DOM and User Interaction)
         */
        class DashboardUI {
            constructor() {
                this.elements = this.getElements();
                this.sortableInstances = [];
            }
            
            getElements() {
                return {
                    body: document.body,
                    settingsGearBtn: document.getElementById('settings-gear-btn'),
                    userIdDisplay: document.getElementById('user-id-display'),
                    widgetContainer: document.getElementById('widget-areas'),
                    dashboardEmptyMessage: document.getElementById('dashboard-empty-message'),
                    siteIconLink: document.querySelector('link[rel="icon"]'),
                    headerWidgetsContainer: document.getElementById('header-widgets'),
                    footerWidgetsContainer: document.getElementById('footer-widgets'),
                    // Modals
                    widgetModal: document.getElementById('widget-modal'),
                    mainSettingsModal: document.getElementById('main-settings-modal'),
                    confirmModal: document.getElementById('confirm-modal'),
                    messageModal: document.getElementById('message-modal'),
                    // Forms
                    widgetForm: document.getElementById('widget-form'),
                    generalSettingsForm: document.getElementById('general-settings-form'),
                    // Form elements
                    modalTitle: document.getElementById('modal-title'),
                    submitFormBtn: document.getElementById('submit-form-btn'),
                    contentTypeSelect: document.getElementById('widget-content-type'),
                    widgetTypeInput: document.getElementById('widget-type'),
                    htmlContentGroup: document.getElementById('html-content-group'),
                    urlContentGroup: document.getElementById('url-content-group'),
                    geminiPromptGroup: document.getElementById('gemini-prompt-group'),
                    sizeOptionsGroup: document.getElementById('size-options'),
                    confirmMessage: document.getElementById('confirm-message'),
                    confirmOkBtn: document.getElementById('confirm-ok-btn'),
                    confirmCancelBtn: document.getElementById('confirm-cancel-btn'),
                    messageText: document.getElementById('message-text'),
                    messageOkBtn: document.getElementById('message-ok-btn'),
                    // Tabs
                    tabButtons: document.querySelectorAll('.tab-button'),
                    tabContents: document.querySelectorAll('.tab-content')
                };
            }

            toggleTheme() {
                this.elements.body.classList.toggle('dark-theme');
                const isDark = this.elements.body.classList.contains('dark-theme');
                // Persist theme choice in a separate local storage item for instant feedback
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            }

            applySavedTheme() {
                const savedTheme = localStorage.getItem('theme') || 'light';
                if (savedTheme === 'dark') {
                    this.elements.body.classList.add('dark-theme');
                }
            }
            
            updateUserIdDisplay(userId) {
                // Not used in this version, but kept for consistency
                this.elements.userIdDisplay.style.display = 'none';
            }

            /** @param {string} tabId */
            showTab(tabId) {
                this.elements.tabButtons.forEach(button => {
                    if (button.dataset.tabTarget === tabId) {
                        button.classList.add('active');
                    } else {
                        button.classList.remove('active');
                    }
                });
                this.elements.tabContents.forEach(content => {
                    if (content.id === `${tabId}-tab`) {
                        content.classList.add('active');
                    } else {
                        content.classList.remove('active');
                    }
                });
            }

            /** @param {Array<Object>} widgets @param {Object} errorMonitorService */
            renderWidgets(widgets, errorMonitorService) {
                this.elements.widgetContainer.innerHTML = '';
                
                // Separate hero widgets for distinct rendering logic
                const dashboardWidgets = widgets.filter(w => w.type === 'dashboard');
                const heroWidgets = widgets.filter(w => w.type === 'hero');

                this.elements.dashboardEmptyMessage.classList.toggle('hidden', dashboardWidgets.length > 0);

                if (dashboardWidgets.length === 0) return;

                const groupedWidgets = dashboardWidgets.reduce((acc, widget) => {
                    (acc[widget.areaId] = acc[widget.areaId] || []).push(widget);
                    return acc;
                }, {});

                // Destroy old Sortable instances to prevent duplicates
                this.sortableInstances.forEach(sortable => sortable.destroy());
                this.sortableInstances = [];

                for (const areaId in groupedWidgets) {
                    const areaHtml = this.createWidgetArea(areaId, groupedWidgets[areaId]);
                    this.elements.widgetContainer.insertAdjacentHTML('beforeend', areaHtml);
                    
                    const gridEl = this.elements.widgetContainer.querySelector(`[data-area-id="${areaId}"] .grid-container`);
                    const sortable = new Sortable(gridEl, {
                        group: 'shared-widgets',
                        animation: 150,
                        ghostClass: 'neumorphic-in',
                        dataIdAttr: 'data-id',
                        onEnd: function (evt) {
                            const orderedIds = Sortable.toArray(evt.to);
                            DashboardController.handleReorder(orderedIds);
                        }
                    });
                    this.sortableInstances.push(sortable);
                }
                
                // Re-wire error monitor
                const errorMonitorWidget = dashboardWidgets.find(w => w.contentType === 'error-monitor');
                if (errorMonitorWidget) {
                    const errorListEl = this.elements.widgetContainer.querySelector('.error-monitor ul');
                    if (errorListEl) {
                        errorMonitorService.subscribe((errors) => {
                            errorListEl.innerHTML = '';
                            errors.forEach(error => {
                                const li = document.createElement('li');
                                li.innerHTML = `<span class="error-type">${error.type}:</span> <span class="error-details">${error.message}</span>`;
                                errorListEl.appendChild(li);
                            });
                        });
                    }
                }
                
                 // Populate gemini widgets
                dashboardWidgets.filter(w => w.contentType === 'gemini_text' && !w.content).forEach(widget => {
                    DashboardController.populateGeminiWidget(widget.id, widget.geminiPrompt);
                });
            }

            /** @param {string} id @param {Array<Object>} widgets */
            createWidgetArea(id, widgets) {
                const widgetHtml = widgets.map(w => this.createWidgetCard(w)).join('');
                return `
                    <div class="space-y-2" data-area-id="${id}">
                        <h3 class="text-base font-bold mb-2">${id.charAt(0).toUpperCase() + id.slice(1)} Area</h3>
                        <div class="grid-container">
                            ${widgetHtml}
                        </div>
                    </div>
                `;
            }
            
            /** @param {Object} widget */
            createWidgetCard(widget) {
                const managementButtons = `
                    <div class="widget-controls flex items-center space-x-1">
                        <button class="neumorphic-button rounded-full w-4 h-4 flex items-center justify-center font-bold text-xxs edit-widget-btn" data-id="${widget.id}" title="Edit">&#9998;</button>
                        <button class="neumorphic-button rounded-full w-4 h-4 flex items-center justify-center font-bold text-xxs delete-widget-btn" data-id="${widget.id}" title="Delete">&times;</button>
                    </div>`;
                
                let cardContent = '';
                if (widget.contentType === 'url') {
                    cardContent = `<iframe src="${widget.contentUrl}" title="${widget.title}" sandbox="allow-scripts allow-popups allow-forms" class="w-full h-full border-0"></iframe>`;
                } else if (widget.contentType === 'html') {
                    cardContent = `
                        <iframe srcdoc="${this.escapeHtml(widget.content)}" title="${widget.title}" sandbox="allow-scripts allow-popups allow-forms" class="w-full h-full border-0"></iframe>
                    `;
                } else if (widget.contentType === 'gemini_text') {
                    if (widget.content) {
                        cardContent = `<p>${widget.content}</p>`;
                    } else {
                        cardContent = `<div class="p-4 flex items-center justify-center"><div class="loader"></div></div>`;
                    }
                } else if (widget.contentType === 'error-monitor') {
                    cardContent = `<div class="error-monitor"><ul></ul></div>`;
                } else {
                    cardContent = `<p>${widget.content}</p>`;
                }
                
                const tagsHtml = (widget.tags && widget.tags.length > 0) ? `
                    <div class="p-1 border-t border-solid border-gray-300 dark:border-gray-600">
                        <span class="text-xxs opacity-60">Tags: </span>
                        ${widget.tags.map(tag => `<span class="px-1 py-0.5 rounded-sm text-xxs opacity-70 border border-solid border-gray-400 dark:border-gray-600">${tag}</span>`).join(' ')}
                    </div>` : '';
                
                const gridColumnSpan = `span ${widget.width || 1}`;
                const gridRowSpan = `span ${widget.height || 1}`;
                
                const draggableClass = widget.contentType === 'error-monitor' ? '' : 'draggable';

                return `
                    <div class="widget-card neumorphic-out rounded-xl ${draggableClass}" data-id="${widget.id}" style="grid-column: ${gridColumnSpan}; grid-row: ${gridRowSpan};">
                        <div class="widget-card__header flex justify-between items-center p-2">
                            <h4 class="text-sm font-semibold">${widget.title}</h4>
                            ${managementButtons}
                        </div>
                        <div class="widget-card__body p-2 text-xs">
                            ${cardContent}
                        </div>
                        ${tagsHtml}
                    </div>
                `;
            }

            /** @param {string} unsafeString */
            escapeHtml(unsafeString) {
                return unsafeString.replace(/&/g, "&amp;")
                                   .replace(/</g, "&lt;")
                                   .replace(/>/g, "&gt;")
                                   .replace(/"/g, "&quot;")
                                   .replace(/'/g, "&#039;");
            }

            /** @param {Array<Object>} heroWidgets */
            renderHeroWidgets(heroWidgets) {
                this.elements.headerWidgetsContainer.innerHTML = '';
                this.elements.footerWidgetsContainer.innerHTML = '';

                heroWidgets.forEach(widget => {
                    const heroWidgetEl = this.createHeroWidgetCard(widget);
                    if (widget.areaId === 'header-hero') {
                        this.elements.headerWidgetsContainer.appendChild(heroWidgetEl);
                    } else if (widget.areaId === 'footer-hero') {
                         this.elements.footerWidgetsContainer.appendChild(heroWidgetEl);
                    }
                });
            }

            /** @param {Object} widget */
            createHeroWidgetCard(widget) {
                const heroWidgetEl = document.createElement('div');
                heroWidgetEl.classList.add('hero-widget', 'neumorphic-out', 'rounded-full', 'px-4', 'py-1', 'text-xs', 'font-semibold');
                heroWidgetEl.dataset.id = widget.id;
                heroWidgetEl.dataset.type = 'hero';
                
                let contentHtml = '';
                if (widget.contentType === 'text') {
                    contentHtml = `<span>${widget.content}</span>`;
                } else if (widget.contentType === 'toggle') {
                    const savedTheme = localStorage.getItem('theme') || 'light';
                    const isToggled = savedTheme === 'dark' ? 'toggled' : '';
                    contentHtml = `<div class="toggle-switch ${isToggled}" data-toggle-id="${widget.id}"><div class="dot"></div></div>`;
                } else if (widget.contentType === 'html') {
                    contentHtml = `<div>${widget.content}</div>`;
                }

                heroWidgetEl.innerHTML = `
                    <div class="flex items-center space-x-2">
                        ${contentHtml}
                        <div class="widget-controls flex items-center space-x-1">
                            <button class="neumorphic-button rounded-full w-4 h-4 flex items-center justify-center font-bold text-xxs edit-hero-btn" data-id="${widget.id}" title="Edit">&#9998;</button>
                            <button class="neumorphic-button rounded-full w-4 h-4 flex items-center justify-center font-bold text-xxs delete-hero-btn" data-id="${widget.id}" title="Delete">&times;</button>
                        </div>
                    </div>
                `;

                return heroWidgetEl;
            }

            /** @param {Object} settings */
            renderSettings(settings) {
                document.getElementById('site-icon-input').value = settings.siteIconUrl;
            }

            /** @param {boolean} isEditing @param {Object} [data] @param {string} type*/
            showWidgetModal(isEditing = false, data = {}, type = 'dashboard') {
                this.elements.widgetModal.classList.remove('hidden');
                this.elements.mainSettingsModal.classList.add('hidden'); // Hide settings modal
                this.elements.modalTitle.textContent = isEditing ? 'Edit Widget' : 'Add New Widget';
                this.elements.widgetForm.dataset.editingId = isEditing ? data.id : '';
                this.elements.widgetForm.querySelector('#widget-id').value = data.id || this.generateUUID();
                this.elements.widgetForm.querySelector('#widget-type').value = type;
                this.elements.widgetForm.querySelector('#widget-title').value = data.title || '';
                this.elements.widgetForm.querySelector('#widget-area-id').value = data.areaId || (type === 'hero' ? 'header-hero' : 'main');
                this.elements.contentTypeSelect.value = data.contentType || 'html';
                this.elements.widgetForm.querySelector('#widget-content').value = data.content || '';
                this.elements.widgetForm.querySelector('#widget-content-url').value = data.contentUrl || '';
                this.elements.widgetForm.querySelector('#widget-width').value = data.width || 1;
                this.elements.widgetForm.querySelector('#widget-height').value = data.height || 1;
                this.elements.widgetForm.querySelector('#widget-tags').value = (data.tags || []).join(', ');
                this.elements.widgetForm.querySelector('#gemini-prompt').value = data.geminiPrompt || '';
                this.updateFormFields(type, data.contentType);
                this.elements.submitFormBtn.textContent = isEditing ? 'Update Widget' : 'Add Widget';
            }
            
            showMainSettingsModal() {
                this.elements.mainSettingsModal.classList.remove('hidden');
                this.showTab('general');
                this.renderSettings(DashboardController.localStorageService.loadSettings());
            }

            hideWidgetModal() {
                this.elements.widgetModal.classList.add('hidden');
                this.elements.widgetForm.reset();
                this.elements.widgetForm.dataset.editingId = '';
            }
            
            hideMainSettingsModal() {
                this.elements.mainSettingsModal.classList.add('hidden');
            }
            
            updateFormFields(widgetType, contentType) {
                this.elements.sizeOptionsGroup.classList.toggle('hidden', widgetType === 'hero');
                this.elements.htmlContentGroup.classList.toggle('hidden', contentType !== 'html' && contentType !== 'text' && contentType !== 'toggle');
                this.elements.urlContentGroup.classList.toggle('hidden', contentType !== 'url');
                this.elements.geminiPromptGroup.classList.toggle('hidden', contentType !== 'gemini_text');

                // Adjust options based on widget type
                if (widgetType === 'hero') {
                    this.elements.contentTypeSelect.innerHTML = `
                        <option value="text">Line of Text</option>
                        <option value="toggle">Toggle Switch</option>
                        <option value="html">Inline HTML</option>
                    `;
                } else {
                     this.elements.contentTypeSelect.innerHTML = `
                        <option value="html">Inline HTML</option>
                        <option value="url">URL (iframe)</option>
                        <option value="gemini_text">AI-Generated Text</option>
                    `;
                }
            }
            
            /** @param {string} message @returns {Promise<boolean>} */
            showConfirm(message) {
                return new Promise((resolve) => {
                    this.elements.confirmMessage.textContent = message;
                    this.elements.confirmModal.classList.remove('hidden');

                    const onConfirm = () => {
                        this.elements.confirmModal.classList.add('hidden');
                        this.elements.confirmOkBtn.removeEventListener('click', onConfirm);
                        this.elements.confirmCancelBtn.removeEventListener('click', onCancel);
                        resolve(true);
                    };
                    const onCancel = () => {
                        this.elements.confirmModal.classList.add('hidden');
                        this.elements.confirmOkBtn.removeEventListener('click', onConfirm);
                        this.elements.confirmCancelBtn.removeEventListener('click', onCancel);
                        resolve(false);
                    };
                    this.elements.confirmOkBtn.addEventListener('click', onConfirm);
                    this.elements.confirmCancelBtn.addEventListener('click', onCancel);
                });
            }
            
            /** @param {string} message @returns {Promise<void>} */
            showMessage(message) {
                return new Promise((resolve) => {
                    this.elements.messageText.textContent = message;
                    this.elements.messageModal.classList.remove('hidden');

                    const onOk = () => {
                        this.elements.messageModal.classList.add('hidden');
                        this.elements.messageOkBtn.removeEventListener('click', onOk);
                        resolve();
                    };
                    this.elements.messageOkBtn.addEventListener('click', onOk);
                });
            }

            /** @param {Object} settings */
            updateSiteInfo(settings) {
                if (settings.siteIconUrl) {
                    if (!this.elements.siteIconLink) {
                        const link = document.createElement('link');
                        link.rel = 'icon';
                        this.elements.siteIconLink = link;
                        document.head.appendChild(link);
                    }
                    this.elements.siteIconLink.href = settings.siteIconUrl;
                }
            }
            
            generateUUID() {
                return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                    const r = Math.random() * 16 | 0;
                    const v = c === 'x' ? r : (r & 0x3 | 0x8);
                    return v.toString(16);
                });
            }
        }

        /**
         * 🚀 Main Application Controller (Orchestrates all actions)
         */
        const DashboardController = {
            localStorageService: new LocalStorageService(),
            errorMonitorService: new ErrorMonitorService(),
            ui: new DashboardUI(),
            
            init: function() {
                this.ui.applySavedTheme();
                this.setupEventListeners();
                this.refreshUI();
            },
            
            setupEventListeners: function() {
                this.ui.elements.settingsGearBtn.addEventListener('click', this.ui.showMainSettingsModal.bind(this.ui));
                
                document.getElementById('add-widget-btn').addEventListener('click', () => { this.ui.hideMainSettingsModal(); this.ui.showWidgetModal(false, {}, 'dashboard'); });
                document.getElementById('add-hero-widget-btn').addEventListener('click', () => { this.ui.hideMainSettingsModal(); this.ui.showWidgetModal(false, {}, 'hero'); });
                document.getElementById('load-sample-btn').addEventListener('click', this.handleLoadSample.bind(this));
                document.getElementById('clear-btn').addEventListener('click', this.handleClear.bind(this));
                
                this.ui.elements.contentTypeSelect.addEventListener('change', (e) => this.ui.updateFormFields(this.ui.elements.widgetTypeInput.value, e.target.value));
                
                document.getElementById('close-widget-modal-btn').addEventListener('click', this.ui.hideWidgetModal.bind(this.ui));
                document.getElementById('close-settings-modal-btn').addEventListener('click', this.ui.hideMainSettingsModal.bind(this.ui));
                document.getElementById('cancel-form-btn').addEventListener('click', this.ui.hideWidgetModal.bind(this.ui));
                this.ui.elements.widgetForm.addEventListener('submit', this.handleFormSubmit.bind(this));
                this.ui.elements.widgetContainer.addEventListener('click', this.handleWidgetAction.bind(this));
                this.ui.elements.headerWidgetsContainer.addEventListener('click', this.handleHeroWidgetAction.bind(this));
                this.ui.elements.footerWidgetsContainer.addEventListener('click', this.handleHeroWidgetAction.bind(this));
                
                document.addEventListener('click', (e) => {
                     if (e.target.closest('[data-toggle-id]')) {
                        this.ui.toggleTheme();
                        e.target.closest('[data-toggle-id]').classList.toggle('toggled');
                    }
                });
                
                this.ui.elements.tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        const targetTab = button.dataset.tabTarget;
                        this.ui.showTab(targetTab);
                    });
                });

                this.ui.elements.generalSettingsForm.addEventListener('submit', this.handleSettingsSave.bind(this));
                
                document.getElementById('export-btn').addEventListener('click', this.handleExport.bind(this));
                document.getElementById('import-btn').addEventListener('click', this.handleImport.bind(this));
            },
            
            handleLoadSample: async function() {
                const sampleDashboardWidgets = [
                    { id: this.ui.generateUUID(), title: 'Daily Tasks', contentType: 'html', content: '<div class="p-2 text-xs"><ul><li>Finish project report</li><li>Review team feedback</li><li>Call client A</li></ul></div>', areaId: 'main', width: 1, height: 2, tags: ['tasks', 'productivity'], type: 'dashboard' },
                    { id: this.ui.generateUUID(), title: 'Inspirational Quote', contentType: 'gemini_text', geminiPrompt: 'Write a short, inspirational quote about persistence in a professional tone.', areaId: 'main', width: 2, height: 1, tags: ['ai', 'quote'], type: 'dashboard' }
                ];
                
                const sampleHeroWidgets = [
                    { id: this.ui.generateUUID(), title: 'Site Name', contentType: 'text', content: 'Neumorphic CMS', areaId: 'header-hero', type: 'hero' },
                    { id: this.ui.generateUUID(), title: 'Theme Toggle', contentType: 'toggle', areaId: 'header-hero', type: 'hero' },
                    { id: this.ui.generateUUID(), title: 'Current Time', contentType: 'text', content: new Date().toLocaleTimeString(), areaId: 'footer-hero', type: 'hero' }
                ];
                
                const allWidgets = [...sampleDashboardWidgets, ...sampleHeroWidgets];
                this.localStorageService.saveWidgets(allWidgets);
                this.refreshUI();
                await this.ui.showMessage('Sample widgets loaded successfully!');
            },
            
            handleClear: async function() {
                const confirmed = await this.ui.showConfirm('Are you sure you want to clear all widgets? This cannot be undone.');
                if (confirmed) {
                    this.localStorageService.saveWidgets([]);
                    this.refreshUI();
                    await this.ui.showMessage('All widgets have been cleared.');
                }
            },
            
            handleFormSubmit: async function(event) {
                event.preventDefault();
                const formData = new FormData(event.target);
                const data = Object.fromEntries(formData.entries());
                const editingId = event.target.dataset.editingId;
                
                const widgets = this.localStorageService.loadWidgets();
                
                const widgetData = {
                    id: data.id,
                    title: data.title,
                    areaId: data.areaId,
                    contentType: data.contentType,
                    tags: data.tags ? data.tags.split(',').map(tag => tag.trim()) : [],
                    type: data.type
                };
                
                if (data.type === 'dashboard') {
                    widgetData.width = parseInt(data.width) || 1;
                    widgetData.height = parseInt(data.height) || 1;
                }
                
                if (data.contentType === 'html' || data.contentType === 'text' || data.contentType === 'toggle') {
                    widgetData.content = data.content;
                } else if (data.contentType === 'url') {
                    widgetData.contentUrl = data.contentUrl;
                } else if (data.contentType === 'gemini_text') {
                    widgetData.geminiPrompt = data.geminiPrompt;
                    widgetData.content = null; // Clear old content, will be populated by AI
                }

                if (editingId) {
                    const index = widgets.findIndex(w => w.id === editingId);
                    if (index !== -1) {
                        widgets[index] = { ...widgets[index], ...widgetData };
                    }
                } else {
                    widgets.push(widgetData);
                }
                
                this.localStorageService.saveWidgets(widgets);
                this.ui.hideWidgetModal();
                this.refreshUI();
            },
            
            handleWidgetAction: async function(event) {
                const target = event.target;
                const widgetCard = target.closest('.widget-card');
                if (!widgetCard) return;

                const widgetId = widgetCard.dataset.id;
                
                if (target.classList.contains('delete-widget-btn')) {
                    const confirmed = await this.ui.showConfirm('Are you sure you want to delete this widget?');
                    if (confirmed) {
                        const widgets = this.localStorageService.loadWidgets().filter(w => w.id !== widgetId);
                        this.localStorageService.saveWidgets(widgets);
                        this.refreshUI();
                    }
                } else if (target.classList.contains('edit-widget-btn')) {
                    const widgets = this.localStorageService.loadWidgets();
                    const widgetToEdit = widgets.find(w => w.id === widgetId);
                    if (widgetToEdit) {
                        this.ui.showWidgetModal(true, widgetToEdit, 'dashboard');
                    }
                }
            },
            
            handleHeroWidgetAction: async function(event) {
                const target = event.target;
                const widgetCard = target.closest('.hero-widget');
                if (!widgetCard) return;

                const widgetId = widgetCard.dataset.id;

                if (target.classList.contains('delete-hero-btn')) {
                    const confirmed = await this.ui.showConfirm('Are you sure you want to delete this hero widget?');
                    if (confirmed) {
                        const widgets = this.localStorageService.loadWidgets().filter(w => w.id !== widgetId);
                        this.localStorageService.saveWidgets(widgets);
                        this.refreshUI();
                    }
                } else if (target.classList.contains('edit-hero-btn')) {
                    const widgets = this.localStorageService.loadWidgets();
                    const widgetToEdit = widgets.find(w => w.id === widgetId);
                    if (widgetToEdit) {
                        this.ui.showWidgetModal(true, widgetToEdit, 'hero');
                    }
                }
            },

            handleReorder: function(orderedIds) {
                const widgets = this.localStorageService.loadWidgets();
                const reorderedWidgets = orderedIds.map(id => widgets.find(w => w.id === id));
                const nonDashboardWidgets = widgets.filter(w => w.type !== 'dashboard');
                const finalWidgets = [...reorderedWidgets, ...nonDashboardWidgets];
                this.localStorageService.saveWidgets(finalWidgets);
                // No need to refreshUI, Sortable.js handles the DOM
            },

            handleSettingsSave: async function(event) {
                event.preventDefault();
                const formData = new FormData(event.target);
                const data = Object.fromEntries(formData.entries());
                this.localStorageService.saveSettings(data);
                this.ui.hideMainSettingsModal();
                this.ui.updateSiteInfo(data);
                await this.ui.showMessage('Settings saved successfully!');
            },

            handleExport: async function() {
                const widgets = this.localStorageService.loadWidgets();
                const settings = this.localStorageService.loadSettings();
                const exportData = { widgets, settings };
                const json = JSON.stringify(exportData, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'cms_layout_export.json';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                await this.ui.showMessage('Layout exported successfully!');
            },

            handleImport: function() {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'application/json';
                fileInput.onchange = async e => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = async event => {
                        try {
                            const importedData = JSON.parse(event.target.result);
                            if (importedData.widgets) {
                                this.localStorageService.saveWidgets(importedData.widgets);
                            }
                            if (importedData.settings) {
                                this.localStorageService.saveSettings(importedData.settings);
                            }
                            this.refreshUI();
                            await this.ui.showMessage('Widgets imported successfully!');
                        } catch (error) {
                            console.error('Import failed:', error);
                            await this.ui.showMessage('Failed to import file. Please check the JSON format.');
                        }
                    };
                    reader.readAsText(file);
                };
                fileInput.click();
            },
            
            populateGeminiWidget: async function(widgetId, prompt) {
                if (!prompt) return;
                const text = await GeminiService.generateText(prompt);
                
                // Find and update the widget in localStorage
                const widgets = this.localStorageService.loadWidgets();
                const widgetIndex = widgets.findIndex(w => w.id === widgetId);
                if (widgetIndex !== -1) {
                    widgets[widgetIndex].content = text;
                    this.localStorageService.saveWidgets(widgets);
                    this.refreshUI();
                }
            },
            
            refreshUI: function() {
                const allWidgets = this.localStorageService.loadWidgets();
                
                // Ensure there's always an error monitor widget
                const hasErrorMonitor = allWidgets.some(w => w.contentType === 'error-monitor');
                if (!hasErrorMonitor) {
                    const errorMonitorWidget = {
                        id: this.ui.generateUUID(),
                        title: 'Error Monitor',
                        contentType: 'error-monitor',
                        areaId: 'main',
                        width: 2,
                        height: 2,
                        tags: ['system', 'error'],
                        type: 'dashboard'
                    };
                    allWidgets.push(errorMonitorWidget);
                    this.localStorageService.saveWidgets(allWidgets);
                }
                
                const settings = this.localStorageService.loadSettings();
                this.ui.updateSiteInfo(settings);
                
                this.ui.renderWidgets(allWidgets, this.errorMonitorService);
                this.ui.renderHeroWidgets(allWidgets);
            }
        };

        // Initialize the app when the window is fully loaded
        window.onload = function() {
            DashboardController.init();
        };
    </script>
</body>
</html>
