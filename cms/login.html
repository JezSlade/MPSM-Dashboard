<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MPS Monitor Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .login-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 2.5rem;
            width: 100%;
            max-width: 400px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-icon {
            font-size: 3rem;
            color: #3498db;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #3498db;
        }

        .btn {
            width: 100%;
            padding: 0.75rem;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background: #2980b9;
        }

        .btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .error {
            background: #fee;
            color: #e74c3c;
            padding: 0.75rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
        }

        .error.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-print"></i>
            </div>
            <h1>MPS Monitor</h1>
            <p style="color: #7f8c8d;">Dashboard Login</p>
        </div>

        <div id="error" class="error"></div>

        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn" id="login-btn">
                <i class="fas fa-sign-in-alt"></i> Login
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; color: #95a5a6; font-size: 0.9rem;">
            Contact your administrator if you need sign-in assistance.
        </p>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
        const forceDesktop = params.get('forceDesktop') === '1';
        const forcedReturn = params.get('returnTo');

        const setDesktopPreference = (value) => {
            const maxAge = 60 * 60 * 24 * 30; // 30 days
            document.cookie = `mpsm_prefers_desktop=${value};path=/;max-age=${maxAge};samesite=Lax`;
        };

        if (forceDesktop) {
            setDesktopPreference('1');
        } else if (isMobile) {
            setDesktopPreference('0');
        }

        const form = document.getElementById('login-form');
        const errorEl = document.getElementById('error');
        const loginBtn = document.getElementById('login-btn');
        const preferredReturn = forcedReturn
            || (isMobile && !forceDesktop ? 'mobile.php' : 'index.php');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                errorEl.textContent = 'Please enter both username and password';
                errorEl.classList.add('active');
                return;
            }

            errorEl.classList.remove('active');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

            try {
                const response = await fetch('api/login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    credentials: 'same-origin',  // Include cookies for session
                    body: JSON.stringify({ username, password })
                });

                // Check if response is OK
                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Login failed:', response.status, errorText);

                    // Try to parse as JSON
                    let errorMsg = 'Login failed';
                    try {
                        const errorData = JSON.parse(errorText);
                        errorMsg = errorData.error || errorMsg;
                    } catch (e) {
                        errorMsg = `Server error (${response.status})`;
                    }

                    throw new Error(errorMsg);
                }

                const data = await response.json();

                if (data.success) {
                    // Successful login - redirect to preferred target (mobile by default on mobile)
                    window.location.href = preferredReturn;
                } else {
                    errorEl.textContent = data.error || 'Invalid credentials';
                    errorEl.classList.add('active');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
                }
            } catch (error) {
                console.error('Login error:', error);

                // Detailed error messages for debugging
                let errorMsg = 'Connection error';

                if (error.message.includes('Failed to fetch')) {
                    errorMsg = 'Cannot connect to server. Please check your internet connection.';
                } else if (error.message.includes('NetworkError')) {
                    errorMsg = 'Network error. Please check your connection and try again.';
                } else if (error.message) {
                    errorMsg = error.message;
                }

                errorEl.textContent = errorMsg;
                errorEl.classList.add('active');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
            }
        });

        // Add Enter key support
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                form.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
