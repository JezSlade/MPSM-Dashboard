<!DOCTYPE html>
<html>
<head>
    <title>Search Test</title>
</head>
<body>
    <h1>Global Search Test</h1>
    <p><strong>Note:</strong> You must be logged into the main dashboard first!</p>
    <button onclick="testSearch()">Test Search for EB821</button>
    <button onclick="testSearchWithInjection()">Test Search with Injected EB821</button>
    <pre id="output"></pre>

    <script>
        const output = document.getElementById('output');

        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        async function testSearch() {
            output.textContent = '';
            log('=== Testing Current Search Logic ===\n');

            try {
                // Simulate the fetchAllDevicesForSearch function
                log('Fetching devices with allCustomers=true...');
                const allDevices = [];
                let pageNumber = 1;
                const maxPages = 50;

                while (pageNumber <= maxPages) {
                    log(`Fetching page ${pageNumber}...`);
                    const response = await fetch(`api/get-devices.php?pageRows=100&pageNumber=${pageNumber}&allCustomers=true`, {
                        credentials: 'same-origin'
                    });

                    if (!response.ok) {
                        log(`  ERROR: HTTP ${response.status} - ${response.statusText}`);
                        if (response.status === 401 || response.status === 302) {
                            log(`  You need to login first! Open the main dashboard and login, then come back here.`);
                        }
                        break;
                    }

                    const data = await response.json();

                    log(`  Response: success=${data.success}, devices=${data.devices?.length || 0}, total=${data.total}`);

                    if (!data.success || !data.devices || data.devices.length === 0) {
                        log(`  STOP: No devices returned`);
                        break;
                    }

                    allDevices.push(...data.devices);
                    log(`  Total devices so far: ${allDevices.length}`);

                    // Stop if we got fewer devices than requested (last page)
                    if (data.devices.length < 100) {
                        log(`  STOP: Got ${data.devices.length} devices (less than 100, must be last page)`);
                        break;
                    }

                    // Stop if we've loaded all devices
                    if (data.total && allDevices.length >= data.total) {
                        log(`  STOP: Loaded ${allDevices.length} >= total ${data.total}`);
                        break;
                    }

                    pageNumber++;
                }

                log(`\nFinal result: ${allDevices.length} devices loaded from ${pageNumber} pages`);

                // Now search for EB821
                log('\nSearching for EB821...');
                const matches = allDevices.filter(d => {
                    const extId = (d.ExternalIdentifier || '').toLowerCase();
                    return extId.includes('eb821');
                });

                log(`Found ${matches.length} matches for EB821`);
                if (matches.length > 0) {
                    matches.forEach(m => {
                        log(`  Match: ExtId="${m.ExternalIdentifier}", Serial="${m.SerialNumber}", Model="${m.Product?.Model}"`);
                    });
                }

            } catch (error) {
                log(`ERROR: ${error.message}`);
            }
        }

        async function testSearchWithInjection() {
            output.textContent = '';
            log('=== Testing Search With Injected EB821 ===\n');

            try {
                // Fetch first page
                log('Fetching page 1...');
                const response = await fetch(`api/get-devices.php?pageRows=100&pageNumber=1&allCustomers=true`, {
                    credentials: 'same-origin'
                });

                if (!response.ok) {
                    log(`ERROR: HTTP ${response.status} - ${response.statusText}`);
                    if (response.status === 401 || response.status === 302) {
                        log(`You need to login first! Open the main dashboard and login, then come back here.`);
                    }
                    return;
                }

                const data = await response.json();

                log(`Response: success=${data.success}, devices=${data.devices?.length || 0}`);

                if (!data.success || !data.devices) {
                    log('ERROR: API call failed');
                    return;
                }

                // Inject a test device
                const testDevice = {
                    Id: 'TEST_EB821_ID',
                    ExternalIdentifier: 'EB821',
                    SerialNumber: 'TEST_SERIAL_EB821',
                    Product: { Model: 'TEST MODEL EB821' },
                    CustomerDescription: 'TEST CUSTOMER',
                    AssetNumber: null
                };

                data.devices.push(testDevice);
                log(`\nInjected test device: ExternalIdentifier="EB821"`);
                log(`Total devices: ${data.devices.length}`);

                // Now search
                log('\nSearching for EB821 in dataset...');
                const matches = data.devices.filter(d => {
                    const extId = (d.ExternalIdentifier || '').toLowerCase();
                    const match = extId.includes('eb821');
                    if (match) {
                        log(`  MATCH FOUND: ExtId="${d.ExternalIdentifier}"`);
                    }
                    return match;
                });

                log(`\nSearch result: ${matches.length} matches`);
                if (matches.length > 0) {
                    log('✓ Search logic works! Device was found.');
                } else {
                    log('✗ Search logic BROKEN! Device was NOT found despite being in dataset.');
                }

            } catch (error) {
                log(`ERROR: ${error.message}`);
            }
        }
    </script>
</body>
</html>
