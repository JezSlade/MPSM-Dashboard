name: FTP Deploy - Final Lean

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔢 Generate version.js in Deploy Path
        run: echo "window.appVersion = \"0.0.0.${{ github.run_number }}\";" > version.js

      - name: 📂 Debug — List Files in Repo
        run: |
          echo "Listing files before deployment:"
          ls -la
          echo "------"
          echo "Checking for problematic files:"
          find . -name "*.log" -o -name ".ftp-deploy-sync-state.json" || true
          echo "------"
          echo "Key files that SHOULD be deployed:"
          ls -la index.php .htaccess .env 2>/dev/null || echo "Some files missing"
          ls -la mps-api/index.php mps-api/engine.php mps-api/.htaccess 2>/dev/null || echo "Some API files missing"
          echo "------"

      - name: 🚀 Deploy Website via FTP
        id: ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.0
        with:
          server: ftp.resolutionsbydesign.us
          username: mpsm@mpsm.resolutionsbydesign.us
          password: Deploy123!
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /
          state-name: .ftp-deploy-sync-state.json
          dry-run: false
          dangerous-clean-slate: true
          exclude: |
            **/.git/**
            **/.github/**
            **/.gitignore
            **/.vscode/**
            **/.idea/**
            **/.DS_Store
            **/Thumbs.db
            **/node_modules/**
            **/tests/**
            **/__pycache__/**
            **/*.pyc
            **/.env.example
            **/package*.json
            **/composer.json
            **/composer.lock
            **/phpunit.xml
            **/.phpunit.result.cache
            mps-api/test_*.php
            mps-api/verify_*.py
            **/*.log
            .claude/**
            .ftp-deploy-sync-state.json
            documentation/**
          log-level: verbose

      - name: 📜 Deployment Completed Report
        run: |
          echo "### DEPLOYMENT SUMMARY ###"
          echo "- Version: 0.0.0.${{ github.run_number }}"
          echo "- FTP Server: ftp.resolutionsbydesign.us"
          echo "- Server Directory: /"
          echo "- Files in Deployment:"
          find . -type f
