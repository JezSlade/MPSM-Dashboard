<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPS API Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Seg OE UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #60a5fa; margin-bottom: 10px; }
        .subtitle { color: #94a3b8; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .panel {
            background: #1e293b;
            border-radius: 8px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .panel h2 { color: #38bdf8; margin-bottom: 15px; font-size: 18px; }
        .test-form { display: flex; flex-direction: column; gap: 10px; }
        .test-form input, .test-form textarea {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 10px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
        }
        .test-form textarea { min-height: 100px; font-size: 13px; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover { background: #2563eb; }
        button:active { background: #1d4ed8; }
        .quick-tests { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .quick-test-btn {
            background: #475569;
            padding: 10px;
            text-align: left;
            font-size: 13px;
        }
        .quick-test-btn:hover { background: #64748b; }
        .response-panel { grid-column: 1 / -1; }
        pre {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 13px;
            line-height: 1.5;
        }
        .status { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .status.success { background: #065f46; color: #6ee7b7; }
        .status.error { background: #7f1d1d; color: #fca5a5; }
        .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .info-item { background: #0f172a; padding: 10px; border-radius: 4px; }
        .info-label { color: #94a3b8; font-size: 12px; margin-bottom: 4px; }
        .info-value { color: #e2e8f0; font-family: 'Consolas', monospace; font-size: 14px; }
        .loading { display: none; color: #60a5fa; margin-top: 10px; }
        .loading.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MPS API Engine Dashboard</h1>
        <p class="subtitle">ChatGPT-Style Testing & Debug Interface</p>

        <div class="grid">
            <!-- API Info Panel -->
            <div class="panel">
                <h2>📊 API Information</h2>
                <div class="info-grid" id="apiInfo">
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value">Loading...</div>
                    </div>
                </div>
            </div>

            <!-- Quick Test Panel -->
            <div class="panel">
                <h2>⚡ Quick Tests</h2>
                <div class="quick-tests">
                    <button class="quick-test-btn" onclick="quickTest('AlertLimit/Dealer/Get', {})">Dealer Alert Limits</button>
                    <button class="quick-test-btn" onclick="quickTest('ApiClient/List', {})">List API Clients</button>
                    <button class="quick-test-btn" onclick="quickTest('CustomField/List', {})">List Custom Fields</button>
                    <button class="quick-test-btn" onclick="quickTest('DealerProduct/List', {})">List Products</button>
                    <button class="quick-test-btn" onclick="quickTest('CustomerDashboard', {})">Customer Dashboard</button>
                    <button class="quick-test-btn" onclick="quickTest('Role/List', {})">List Roles</button>
                </div>
            </div>

            <!-- Custom Test Panel -->
            <div class="panel">
                <h2>🧪 Custom Test</h2>
                <div class="test-form">
                    <input type="text" id="action" placeholder="Action (e.g., AlertLimit/Dealer/Get)" value="AlertLimit/Dealer/Get">
                    <textarea id="params" placeholder="Parameters (JSON object)">{}</textarea>
                    <button onclick="customTest()">Execute Test</button>
                    <div class="loading" id="loading">⏳ Executing...</div>
                </div>
            </div>

            <!-- Health Check Panel -->
            <div class="panel">
                <h2>💚 Health Check</h2>
                <button onclick="healthCheck()">Run Health Check</button>
                <div id="healthStatus" style="margin-top: 10px;"></div>
            </div>

            <!-- Response Panel -->
            <div class="panel response-panel">
                <h2>📄 Response</h2>
                <pre id="response">No test executed yet. Try a quick test or enter a custom action above.</pre>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/mps-api';

        // Load API info on page load
        async function loadApiInfo() {
            try {
                const response = await fetch(API_BASE + '/');
                const data = await response.json();

                const infoHtml = `
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value"><span class="status success">Online</span></div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Version</div>
                        <div class="info-value">${data.version}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Actions Available</div>
                        <div class="info-value">${data.action_count}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Dealer Code</div>
                        <div class="info-value">${data.api_interaction_data.dealer_code}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Templates Loaded</div>
                        <div class="info-value">${data.api_interaction_data.payload_templates}</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Auth Method</div>
                        <div class="info-value">${data.api_interaction_data.auth_method}</div>
                    </div>
                `;
                document.getElementById('apiInfo').innerHTML = infoHtml;
            } catch (error) {
                document.getElementById('apiInfo').innerHTML = `
                    <div class="info-item">
                        <div class="info-label">Status</div>
                        <div class="info-value"><span class="status error">Error: ${error.message}</span></div>
                    </div>
                `;
            }
        }

        async function executeQuery(action, params) {
            const response = await fetch(API_BASE + '/query', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action, params })
            });
            return await response.json();
        }

        function displayResponse(data, action, params) {
            const status = data.success ? 'success' : 'error';
            const statusText = data.success ? 'SUCCESS' : 'FAILED';

            const output = {
                test: {
                    action: action,
                    params: params,
                    timestamp: new Date().toISOString()
                },
                response: data
            };

            document.getElementById('response').innerHTML =
                `<span class="status ${status}">${statusText}</span>\n\n` +
                JSON.stringify(output, null, 2);
        }

        async function quickTest(action, params) {
            document.getElementById('loading').classList.add('active');
            try {
                const data = await executeQuery(action, params);
                displayResponse(data, action, params);
            } catch (error) {
                document.getElementById('response').textContent =
                    `Error: ${error.message}`;
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        async function customTest() {
            const action = document.getElementById('action').value;
            const paramsText = document.getElementById('params').value;

            try {
                const params = JSON.parse(paramsText || '{}');
                document.getElementById('loading').classList.add('active');
                const data = await executeQuery(action, params);
                displayResponse(data, action, params);
            } catch (error) {
                document.getElementById('response').textContent =
                    `Error: ${error.message}`;
            } finally {
                document.getElementById('loading').classList.remove('active');
            }
        }

        async function healthCheck() {
            try {
                const response = await fetch(API_BASE + '/health');
                const data = await response.json();

                const status = data.success ? 'success' : 'error';
                const statusText = data.status.toUpperCase();

                document.getElementById('healthStatus').innerHTML = `
                    <span class="status ${status}">${statusText}</span>
                    <div style="margin-top: 10px; font-size: 13px;">
                        <div>API Reachable: ${data.api_reachable ? '✅' : '❌'}</div>
                        <div>Response Time: ${data.response_time}</div>
                        <div>Test Endpoint: ${data.test_endpoint}</div>
                    </div>
                `;
            } catch (error) {
                document.getElementById('healthStatus').innerHTML =
                    `<span class="status error">ERROR</span>
                    <div style="margin-top: 10px;">${error.message}</div>`;
            }
        }

        // Load API info on page load
        loadApiInfo();
    </script>
</body>
</html>
